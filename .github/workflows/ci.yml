name: ETL Pipeline CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  validate:

    runs-on: ubuntu-latest


    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: etl_project

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:


      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Create CI environment file
        run: |
          touch airflow/.env
          echo "AIRFLOW_UID=50000" >> airflow/.env
          echo "SLACK_WEBHOOK_URL=test" >> airflow/.env


      - name: Validate Docker Compose configuration
        run: docker compose -f airflow/docker-compose.yaml config


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"



      - name: Install dependencies
        run: |
          pip install -r requirements.txt



      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client



      - name: Check PostgreSQL connection
        run: |
          PGPASSWORD=airflow psql \
          -h localhost \
          -U airflow \
          -d etl_project \
          -c "SELECT version();"



      - name: Validate Python syntax
        run: |
          python -m compileall airflow/dags



      - name: Run pytest
        run: |
          pytest tests/



      - name: Check ETL files
        run: |
          test -f airflow/dags/customer_orders_etl_dag.py
          test -f airflow/dags/transform_data.py
          test -f airflow/dags/verify_data.py
          test -f airflow/dags/data_quality_check.py
          test -f airflow/dags/load_data.py